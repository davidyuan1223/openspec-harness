<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">OpenSpec Harness loop model</title>
  <desc id="desc">Hand drawn loop showing explore, test context, propose, reviews, apply, verify, implementation review, and archive.</desc>
  <defs>
    <filter id="sketch"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6"/></filter>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto" markerUnits="strokeWidth"><path d="M2 2 L10 6.5 L2 11" fill="none" stroke="#26221f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .paper{fill:#fffdf7}.frame{fill:none;stroke:#d8c898;stroke-width:2;filter:url(#sketch)}
      .box{fill:#fff6d8;stroke:#26221f;stroke-width:2.2;filter:url(#sketch)}.shadow{fill:none;stroke:#26221f;stroke-width:1.1;opacity:.38;filter:url(#sketch)}
      .skill{fill:#e8f7ed}.review{fill:#e8f1ff}.gate{fill:#ffecef}.ctx{fill:#fff0c9}.evidence{fill:#f2ecff}
      .ink{fill:#26221f;font-family:"Comic Sans MS","Bradley Hand","Trebuchet MS",sans-serif}.title{font-size:29px;font-weight:700}.label{font-size:17px;font-weight:700}.small{font-size:12.5px}
      .line{fill:none;stroke:#26221f;stroke-width:2.15;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow);filter:url(#sketch)}
      .stop{fill:none;stroke:#9b3434;stroke-width:2.1;stroke-dasharray:8 6;marker-end:url(#arrow);filter:url(#sketch)}
      .note{fill:#fffaf0;stroke:#8a6700;stroke-width:1.8;stroke-dasharray:7 6;filter:url(#sketch)}
    </style>
  </defs>
  <rect class="paper" width="1280" height="760"/>
  <path class="frame" d="M34 34 C290 12 968 18 1245 34 C1264 204 1258 570 1240 724 C940 746 310 744 38 724 C18 540 19 200 34 34 Z"/>
  <text class="ink title" x="54" y="64">Harness Loop: one legal step at a time</text>
  <text class="ink small" x="56" y="91">Loop never guesses success. It stops when context, plan, review, execution evidence, or archive gates are missing.</text>

  <g transform="translate(54 145)"><rect class="box skill" width="138" height="86" rx="16"/><rect class="shadow" x="4" y="4" width="130" height="78" rx="14"/><text class="ink label" x="37" y="33">explore</text><text class="ink small" x="21" y="58">rough request</text><text class="ink small" x="18" y="74">ask only gaps</text></g>
  <g transform="translate(232 145)"><rect class="box ctx" width="164" height="86" rx="16"/><rect class="shadow" x="4" y="4" width="156" height="78" rx="14"/><text class="ink label" x="26" y="32">test-context</text><text class="ink small" x="24" y="57">global startup</text><text class="ink small" x="28" y="74">how to verify</text></g>
  <g transform="translate(436 145)"><rect class="box" width="152" height="86" rx="16"/><rect class="shadow" x="4" y="4" width="144" height="78" rx="14"/><text class="ink label" x="39" y="31">propose</text><text class="ink small" x="27" y="56">proposal.md</text><text class="ink small" x="48" y="73">test.md</text></g>
  <g transform="translate(628 145)"><rect class="box review" width="148" height="86" rx="16"/><rect class="shadow" x="4" y="4" width="140" height="78" rx="14"/><text class="ink label" x="20" y="31">business</text><text class="ink label" x="42" y="52">review</text><text class="ink small" x="31" y="73">scenario fit</text></g>
  <g transform="translate(816 145)"><rect class="box review" width="138" height="86" rx="16"/><rect class="shadow" x="4" y="4" width="130" height="78" rx="14"/><text class="ink label" x="28" y="32">design</text><text class="ink label" x="39" y="53">review</text><text class="ink small" x="33" y="73">if needed</text></g>
  <g transform="translate(994 145)"><rect class="box review" width="134" height="86" rx="16"/><rect class="shadow" x="4" y="4" width="126" height="78" rx="14"/><text class="ink label" x="37" y="32">test</text><text class="ink label" x="36" y="53">review</text><text class="ink small" x="22" y="73">plan is real</text></g>
  <g transform="translate(1070 350)"><rect class="box skill" width="134" height="86" rx="16"/><rect class="shadow" x="4" y="4" width="126" height="78" rx="14"/><text class="ink label" x="43" y="36">apply</text><text class="ink small" x="28" y="62">implement only</text></g>
  <g transform="translate(846 350)"><rect class="box gate" width="154" height="86" rx="16"/><rect class="shadow" x="4" y="4" width="146" height="78" rx="14"/><text class="ink label" x="50" y="36">verify</text><text class="ink small" x="22" y="62">execute test.md</text></g>
  <g transform="translate(584 350)"><rect class="box review" width="196" height="86" rx="16"/><rect class="shadow" x="5" y="5" width="186" height="76" rx="14"/><text class="ink label" x="25" y="33">implementation</text><text class="ink label" x="69" y="55">review</text><text class="ink small" x="46" y="74">evidence matches</text></g>
  <g transform="translate(348 350)"><rect class="box evidence" width="158" height="86" rx="16"/><rect class="shadow" x="4" y="4" width="150" height="78" rx="14"/><text class="ink label" x="38" y="34">archive</text><text class="ink small" x="28" y="60">final transition</text></g>

  <path class="line" d="M192 188 C205 188 218 188 232 188"/><path class="line" d="M396 188 C410 188 423 188 436 188"/><path class="line" d="M588 188 C602 188 615 188 628 188"/><path class="line" d="M776 188 C790 188 802 188 816 188"/><path class="line" d="M954 188 C968 188 980 188 994 188"/><path class="line" d="M1128 188 C1198 214 1212 300 1174 350"/><path class="line" d="M1070 392 C1048 392 1024 392 1000 392"/><path class="line" d="M846 392 C824 392 802 392 780 392"/><path class="line" d="M584 392 C558 392 532 392 506 392"/>
  <path class="stop" d="M128 231 C104 302 132 336 232 231"/><path class="stop" d="M510 231 C480 302 526 338 628 231"/><path class="stop" d="M1058 231 C1018 300 1032 330 1110 232"/><path class="stop" d="M924 350 C946 286 958 246 1018 231"/>

  <rect class="note" x="68" y="598" width="1138" height="88" rx="17"/>
  <text class="ink label" x="92" y="632">Testing rule</text>
  <text class="ink small" x="202" y="631">Explore creates the global test context. Propose creates the change test plan. Review test approves the plan before apply.</text>
  <text class="ink small" x="202" y="656">Verify is the testing phase: start the needed environment, run the planned checks, and accept or reject behavior evidence.</text>
</svg>
